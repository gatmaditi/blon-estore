name: Compilar APK Yape Avisos

on:
  push:
    paths:
      - 'android-yape/**'
      - '.github/workflows/android-yape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-yape
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YapeAvisos-apk
          path: android-yape/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar versión para la app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTAS=$(git log -1 --pretty=%B | grep -v -E "^(Co-Authored-By|Claude-Session)" || true)
          gh release create "yape-v${GITHUB_RUN_NUMBER}" android-yape/app/build/outputs/apk/debug/app-debug.apk \
            --title "Yape Avisos ${GITHUB_RUN_NUMBER}" \
            --notes "$NOTAS" --latest
